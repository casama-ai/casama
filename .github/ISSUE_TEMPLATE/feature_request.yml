name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for the apps, the CLI, the SDKs, the MCP server and the docs are welcome here. Casama Cloud's engine isn't in this repo, but you can still tell us what you need from it.
  - type: textarea
    id: problem
    attributes:
      { label: Problem, description: What are you trying to do, and what gets in the way? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: What would you like Casama to do? }
  - type: textarea
    id: alternatives
    attributes:
      { label: Alternatives, description: Workarounds or other approaches you've considered. }
