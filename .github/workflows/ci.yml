# Checks for pull requests and for every sync to main: the TypeScript packages (SDK, MCP server,
# plugin checker, API schemas, formats, safety rules, network guard, browser extension), the Dart
# CLI, SDKs and computerd, and the apps. No secrets are used.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=2 run typecheck
      - name: Tests (includes infra/egress-proxy and apps/extension)
        run: pnpm -r --workspace-concurrency=2 run test
      - name: Browser extension builds
        run: |
          scripts/build-extension.sh
          scripts/build-extension.sh firefox

  dart:
    name: Dart CLI, SDKs and computerd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart test cli casama_sdk computerd

  app-analyze:
    name: App analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze --no-pub

  app-test:
    name: App tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - name: Native build packages
        working-directory: .
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter test --no-pub --total-shards 4 --shard-index ${{ matrix.shard }}
